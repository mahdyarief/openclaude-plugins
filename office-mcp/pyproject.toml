[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-mcp"
version = "0.1.0"
description = "MCP server for managing Word, Excel, and PowerPoint documents via stdio JSON-RPC"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "office-mcp contributors"},
]
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "office", "docx", "xlsx", "pptx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.27,<2",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "mammoth>=1.8",
    "defusedxml",
    "pydantic>=2",
    "xlsxwriter>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyflakes>=3",
    "pypdf>=4",
]

[project.scripts]
office-mcp = "server:main"

[project.urls]
Homepage = "https://example.com/office-mcp"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["office_mcp*"]
exclude = ["tests*", "research*", "fixtures*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyflakes]
exclude = [".venv", "build", "dist"]
