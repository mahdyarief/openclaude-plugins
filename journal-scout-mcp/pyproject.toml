[project]
name = "journal-scout-mcp"
version = "2.0.0"
description = "MCP server for multi-source journal research (Scopus, arXiv, OpenAlex, Semantic Scholar, Crossref, DBLP, Unpaywall)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
web = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
journal-scout-mcp = "josc.server:start"
josc-web = "josc.api:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/josc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
