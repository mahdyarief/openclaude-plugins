[project]
name = "journal-scout-mcp"
version = "2.3.0"
description = "MCP server for multi-source journal research (Scopus, arXiv, OpenAlex, Semantic Scholar, Crossref, PubMed, DBLP, Garuda)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8"]
web = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
journal-scout-mcp = "josc.server:start"
josc-web = "josc.api:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/josc"]

# The git root lives one level above this project, so hatchling does not pick up
# web/.gitignore and would otherwise ship web/node_modules inside the sdist.
[tool.hatch.build.targets.sdist]
exclude = [
  "web/node_modules",
  "web/dist",
  "dist",
  "build",
  ".venv",
  "**/__pycache__",
  "**/*.pyc",
  "**/*.log",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

# Pyflakes plus the small pycodestyle subsets every Python project agrees on.
# Deliberately not ruff's full default set: this codebase predates it, and
# turning on the pyupgrade rules would rewrite 400+ annotations in one go.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
