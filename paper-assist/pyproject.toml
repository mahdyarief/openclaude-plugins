[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "paperassist"
version = "4.2.0"
description = "Model-free research runtime: deterministic task packs executed by an external AI harness"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PaperAssist contributors"}]
# The runtime and MCP server use only the standard library.
dependencies = []

[project.scripts]
paperassist = "mcp_servers.stdio:main"

[project.optional-dependencies]
# Optional PDF text extraction for reference excerpts (pymupdf, then pypdf).
writing = [
  "pymupdf==1.27.1",
  "pypdf==6.7.5",
]
dev = [
  "mypy==1.16.1",
  "pytest==8.4.1",
  "ruff==0.12.2",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = [
  "engine*",
  "mcp_servers*",
  "paperassist*",
  "skills*",
]

[tool.setuptools.package-data]
skills = [
  "*/*.json",
  "*/SKILL.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["paperassist"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
